name: Weekly Top 10

on:
  workflow_dispatch:
    inputs:
      probe: { type: boolean, default: true }
  schedule:
    - cron: '0 15 * * 0'   # Sundays, 10am Central (9am in winter)

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Its own channel if you make one; otherwise it goes to #best-deals.
          DISCORD_WEBHOOK_RECAP: ${{ secrets.DISCORD_WEBHOOK_RECAP }}
          DISCORD_WEBHOOK_BEST: ${{ secrets.DISCORD_WEBHOOK_BEST }}
          DISCORD_ALERTS_CHANNEL_ID: ${{ secrets.DISCORD_ALERTS_CHANNEL_ID }}
          EBAY_CAMPAIGN_ID: '5339178457'
          PROBE: ${{ github.event.inputs.probe || 'false' }}
        run: python post_recap.py

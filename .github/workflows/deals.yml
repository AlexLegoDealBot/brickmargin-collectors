name: Deals Collector

# Deals go stale fast — a good listing is gone in hours. Six times a day.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Probe mode — print findings, write nothing'
        type: boolean
        default: true
      min_discount:
        description: 'Percent below market value to qualify'
        default: '15'
      min_margin:
        description: 'Percent profit after fees to qualify'
        default: '20'
      max_sets:
        description: 'How many sets to scan'
        default: '300'
  schedule:
    - cron: '0 2,6,10,14,18,22 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Find deals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          # Scheduled runs have no inputs, so fall back to writing mode.
          PROBE: ${{ github.event.inputs.probe || 'false' }}
          MIN_DISCOUNT: ${{ github.event.inputs.min_discount || '15' }}
          MIN_MARGIN: ${{ github.event.inputs.min_margin || '20' }}
          MAX_SETS: ${{ github.event.inputs.max_sets || '300' }}
        run: python collect_deals.py

name: LEGO News

# Posts new articles from the big LEGO news sites to #lego-news.
# Needs one new secret: DISCORD_WEBHOOK_NEWS (the #lego-news webhook).
# Uses no eBay calls, so it doesn't touch the deals budget.

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Post new LEGO news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
        run: python post_news.py

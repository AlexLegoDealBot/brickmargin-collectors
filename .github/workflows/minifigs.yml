name: Minifigure Prices

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'catalog (walk our sets on BrickLink, run until it reports 0 sets left) or prices'
        default: 'prices'
      probe:
        type: boolean
        default: true
      batch_size:
        default: '1200'
  schedule:
    - cron: '10 5,17 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REBRICKABLE_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
          BRICKLINK_CONSUMER_KEY: ${{ secrets.BRICKLINK_CONSUMER_KEY }}
          BRICKLINK_CONSUMER_SECRET: ${{ secrets.BRICKLINK_CONSUMER_SECRET }}
          BRICKLINK_TOKEN: ${{ secrets.BRICKLINK_TOKEN }}
          BRICKLINK_TOKEN_SECRET: ${{ secrets.BRICKLINK_TOKEN_SECRET }}
          MODE: ${{ github.event.inputs.mode || 'prices' }}
          PROBE: ${{ github.event.inputs.probe || 'false' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '1200' }}
        run: python collect_minifigs.py

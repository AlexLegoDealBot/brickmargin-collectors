name: Comps Collector

# Rotates through the catalog gathering eBay resale prices.
# eBay allows 5,000 Browse calls/day. Eight runs x 600 sets = 4,800/day,
# so the full ~6,700-set catalog cycles about every 4 days with headroom.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'Probe mode — show 5 sets in detail, write nothing'
        type: boolean
        default: true
      batch_size:
        description: 'Sets to process this run'
        default: '600'
      min_listings:
        description: 'Minimum surviving listings before a comp is recorded'
        default: '3'
      strict_sealed:
        description: 'Strict sealed — require the title to positively say sealed/NISB'
        type: boolean
        default: false
  schedule:
    # Every 3 hours — 8 runs a day at 600 sets is 4,800 calls against eBay's
    # 5,000/day ceiling, so a full catalog cycle lands in about 2 days instead
    # of 4. Staggered off the hour to avoid peak API contention.
    - cron: '20 1,4,7,10,13,16,19,22 * * *'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the comps collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          # Scheduled runs get no inputs, so these fall back to full defaults.
          PROBE: ${{ github.event.inputs.probe == 'true' && '1' || '' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '600' }}
          MIN_LISTINGS: ${{ github.event.inputs.min_listings || '3' }}
          STRICT_SEALED: ${{ github.event.inputs.strict_sealed == 'true' && '1' || '' }}
        run: python collect_comps.py
      - name: Tell search engines what changed
        if: github.event.inputs.probe != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}
          SITE_URL: https://www.brickmargin.com
          HOURS: '4'
        run: python ping_indexnow.py

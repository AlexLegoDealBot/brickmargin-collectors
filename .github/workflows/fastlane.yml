name: Fast Lane

# Continuous cover, built to survive GitHub's scheduling.
#
# The old cron said */55, which fires at :00 and :55 — two runs an hour with
# a 45-minute hole between them, not "every 55 minutes". And GitHub delays
# scheduled jobs under load, sometimes by ten minutes or more, so one long
# run per hour leaves gaps whenever that happens.
#
# Short overlapping runs fix both: a fifteen-minute cadence with fourteen
# minutes of scanning means a delayed start is covered by the next one, and
# no gap is ever longer than a single cycle.
on:
  workflow_dispatch:
    inputs:
      probe: { type: boolean, default: false }
      minutes: { default: '14' }
      every: { default: '90' }
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: fastlane
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip            # ~30s a run back, which matters at 96 runs a day
      - run: pip install -r requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
          PROBE: ${{ github.event.inputs.probe || 'false' }}
          MINUTES: ${{ github.event.inputs.minutes || '14' }}
          EVERY: ${{ github.event.inputs.every || '90' }}
          DISCORD_WEBHOOK_RETAIL: ${{ secrets.DISCORD_WEBHOOK_RETAIL }}
          DISCORD_WEBHOOK_MARKET: ${{ secrets.DISCORD_WEBHOOK_MARKET }}
          EBAY_CAMPAIGN_ID: '5339178457'
          MIN_POST_SCORE: '4.0'
        run: python watch_new.py
